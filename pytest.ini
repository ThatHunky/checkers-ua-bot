[pytest]
# Includes the repo root: the root-level test_*.py files are real, passing
# tests that `testpaths = tests` silently excluded, so nothing they covered was
# ever enforced. Non-pytest diagnostic scripts live under scripts/ instead.
testpaths = tests .
norecursedirs = .* venv htmlcov data scripts __pycache__ *.egg build dist
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests

